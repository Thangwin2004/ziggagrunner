<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <title>ZigZag Runner</title>
  </head>

  <body>
    <div id="app">
      <!-- HTML Splash Screen -->
      <div id="splash-screen" style="position: absolute; top:0; left:0; width:100%; height:100%; background:#22302e; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition: opacity 0.5s;">
        <div id="splash-text" style="color:#fffdf8; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:36px; font-weight:800; margin-bottom:20px;">Loading 0%</div>
        <div style="width:300px; height:20px; background:#314641; border-radius:10px; overflow:hidden;">
          <div id="splash-progress" style="width:0%; height:100%; background:#ff8a4c; transition: width 0.1s;"></div>
        </div>
      </div>
      <!-- Pixi Container -->
      <div id="pixi-container"></div>
    </div>
    
    <script src="/wink-bridge.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
